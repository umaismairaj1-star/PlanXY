name: Build PlanXY Portable

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Build Project
        run: |
          if (Test-Path "CMakeLists.txt") {
            cmake -B build -DCMAKE_PREFIX_PATH=$env:QTDIR
            cmake --build build --config Release
          } else {
            $proFile = Get-ChildItem -Filter "*.pro" -Recurse | Select-Object -First 1
            if ($proFile) {
              Set-Location $proFile.DirectoryName
              qmake $proFile.Name
              nmake
            } else {
              qmake -project
              $proCreated = Get-ChildItem -Filter "*.pro" | Select-Object -First 1
              Add-Content -Path $proCreated.FullName -Value "QT += widgets core gui"
              qmake $proCreated.Name
              nmake
            }
          }

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlanXY-Portable
          path: '**/*.exe'
